pluginGroup = dev.ashenarx.project.switcher.intellij
pluginVersion = 1.3.0

platformVersion = 2026.2
pluginSinceBuild = 262
# Pinned: the plugin builds on experimental Jewel API and several internal platform APIs, so a new
# branch has to be tried before it is declared compatible.
pluginUntilBuild = 263.*
javaVersion = 25

kotlin.code.style = official

# The IntelliJ Platform ships its own Kotlin stdlib -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency = false

org.gradle.caching = true
org.gradle.configuration-cache = true
org.gradle.parallel = true
org.gradle.jvmargs = -Xmx2g -XX:MaxMetaspaceSize=768m
