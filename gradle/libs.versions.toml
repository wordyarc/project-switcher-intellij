[versions]
intellijPlatform = "2.19.0"
junit = "6.1.3"
junit4 = "4.13.2"
kotlin = "2.4.21"

[libraries]
junitJupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junitPlatformLauncher = { module = "org.junit.platform:junit-platform-launcher" }
# The platform's JUnit5TestSessionListener still reaches for junit.framework.TestCase.
junit4 = { module = "junit:junit", version.ref = "junit4" }

[plugins]
intellijPlatform = { id = "org.jetbrains.intellij.platform", version.ref = "intellijPlatform" }
kotlin = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlinCompose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
